<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #fff0f3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; font-family: 'Quicksand', sans-serif; perspective: 1200px; }
        .sobre-contenedor { position: relative; width: 260px; height: 170px; cursor: pointer; filter: drop-shadow(0 15px 35px rgba(0,0,0,0.3)); }
        .sobre { position: absolute; bottom: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #ff4d6d, #c9184a); border-radius: 0 0 15px 15px; z-index: 4; }
        .destinatario-sobre { position: absolute; bottom: 15px; left: 15px; color: white; font-family: 'Dancing Script', cursive; font-size: 1.1rem; z-index: 6; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); pointer-events: none; }
        .tapa { position: absolute; top: 0; left: 0; border-left: 130px solid transparent; border-right: 130px solid transparent; border-top: 105px solid #ff758f; border-radius: 12px; transform-origin: top; transition: 1.2s cubic-bezier(0.4, 0, 0.2, 1); z-index: 5; }
        .carta { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.1); width: 240px; height: 160px; background: #fff; border-radius: 10px; transition: 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; border: 8px solid #fff; }
        .carta img { width: 100%; height: 100%; object-fit: cover; border-radius: 5px; }
        .txt-carta { position: absolute; width: 95%; text-align: center; color: #ff0033; font-family: 'Dancing Script', cursive; z-index: 10; font-size: 2.5rem; font-weight: 900; line-height: 1.1; -webkit-text-stroke: 2.5px white; paint-order: stroke fill; filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.2)); }
        .txt-arriba { top: 10px; } 
        .txt-abajo { bottom: 10px; }
        .abierto .tapa { transform: rotateX(180deg); z-index: 1; }
        .abierto .carta { position: fixed; width: 88vw; height: 82vh; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1); z-index: 10; opacity: 1; transition-delay: 0.8s; border: 12px solid #fff; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .texto-guia { position: absolute; bottom: -70px; width: 100%; text-align: center; color: #c9184a; font-weight: 700; animation: latido 1.5s infinite; }
        @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .confeti { position: fixed; top: -50px; font-size: 32px; z-index: 100; pointer-events: none; animation: caida linear forwards; }
        @keyframes caida { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <audio id="musica" preload="auto">
        <source src="https://files.catbox.moe/0y6mca.mp3" type="audio/mpeg">
    </audio>

    <div class="sobre-contenedor" id="sobre" onclick="abrirCarta()">
        <div class="tapa"></div>
        <div class="sobre">
            <div class="destinatario-sobre">Para: Susana</div>
        </div>
        <div class="carta">
            <div class="txt-carta txt-arriba">¡Feliz San Valentín!</div>
            <img src="https://i.postimg.cc/Xq5pmwWd/bd0a97088a1a8f2ab9352c16318e7574.jpg">
            <div class="txt-carta txt-abajo">¿Quisieras ser mi fresita? ❤️</div>
        </div>
        <div class="texto-guia" id="guia">toca para abrir</div>
    </div>

    <script>
        function abrirCarta() {
            const musica = document.getElementById('musica');
            const sobre = document.getElementById('sobre');
            const guia = document.getElementById('guia');

            // Reproducir música
            musica.play();

            sobre.classList.add('abierto');
            sobre.onclick = null; 
            guia.style.display = 'none';

            for (let i = 0; i < 120; i++) {
                setTimeout(crearConfeti, i * 25);
            }
        }

        function crearConfeti() {
            const emojis = ['❤️', '🍓', '💖', '✨'];
            const confeti = document.createElement('div');
            confeti.className = 'confeti';
            confeti.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            confeti.style.left = Math.random() * 100 + 'vw';
            confeti.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
            document.body.appendChild(confeti);
            setTimeout(() => confeti.remove(), 5000);
        }
    </script>
</body>
</html>
